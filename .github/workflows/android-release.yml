# Signed release build of the Android app (apps/android): push a tag like
# `android-v0.2.0` or use "Run workflow". Produces the release APK and the
# Play Store bundle (.aab) as artifacts; uploading to the Play Console stays
# a manual step (Documentation/Android_app.md).
#
# Secrets for signing (all four, or the build stays unsigned):
#   ANDROID_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Repo variable ANDROID_API_URL: the API the release build talks to
# (default https://api.crowdly.cloud, see Documentation/Android_app.md).

name: Android release

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "CROWDLY_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 isn't set; the release build will be unsigned."
          fi

      - name: Release APK and bundle
        env:
          CROWDLY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CROWDLY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CROWDLY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          case "$VERSION" in refs/*|"$GITHUB_REF_NAME") VERSION="0.0.${{ github.run_number }}";; esac
          ./gradlew :app:assembleRelease :app:bundleRelease \
            -Pcrowdly.versionCode=${{ github.run_number }} \
            -Pcrowdly.versionName="$VERSION" \
            -Pcrowdly.releaseServer="${{ vars.ANDROID_API_URL || 'https://api.crowdly.cloud' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: crowdly-android-release
          path: |
            apps/android/app/build/outputs/apk/release/*.apk
            apps/android/app/build/outputs/bundle/release/*.aab

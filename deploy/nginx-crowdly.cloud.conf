# Target-state nginx config for crowdly.cloud, matching Phase 1 of
# "deploy strategy for Crowdly VPS.md": root points only at the built
# frontend (/var/www/crowdly = dist/ output, nothing else), backend source
# and .git live entirely outside any web root (/opt/crowdly-backend).
#
# This is a TEMPLATE, not a byte-for-byte copy of what's live on the VPS
# right now — the real file has certbot's exact cert paths for this
# specific domain (certbot writes/edits those itself when you run
# `certbot --nginx`), and may have directives added since this was written.
# Before replacing the live file: diff this against
# /etc/nginx/sites-available/crowdly.cloud and carry over anything here
# that's missing there, rather than overwriting wholesale.
#
# The proxied path list below is generated from the actual route prefixes
# in vite.config.ts / backend/src/server.js (checked 2026-08-17), not
# copied from memory of the old config — if new top-level route prefixes
# get added to the backend later, add matching location blocks here (and to
# vite.config.ts's dev proxy) at the same time, or they'll 404 in
# production while working fine in dev.

server {
    listen 80;
    listen [::]:80;
    server_name crowdly.cloud www.crowdly.cloud;

    # Required for certbot's renewal to keep working.
    location /.well-known/acme-challenge/ {
        root /var/www/crowdly;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crowdly.cloud www.crowdly.cloud;

    # Managed by certbot — paths as certbot originally wrote them.
    ssl_certificate /etc/letsencrypt/live/crowdly.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crowdly.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparam.pem;

    root /var/www/crowdly;
    index index.html;

    # --- Finding 1 stop-gap (keep even after Phase 1) ---
    # Belt-and-suspenders: even though the web root no longer physically
    # contains backend/ or .git/ after Phase 1, keep these so a future
    # accidental copy into the web root still 404s cleanly instead of being
    # served.
    location ^~ /backend/ {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
    # --- end stop-gap ---

    # --- API proxy: exact mirror of vite.config.ts's dev proxy table ---
    # Keeping this list identical to vite.config.ts is what makes "works in
    # `npm run dev`" and "works in production" mean the same thing.

    location /auth {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /story-titles {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /stories {
        # Uploads: gallery images (10 MB each, up to 10) and story media. nginx's default
        # client_max_body_size is 1m, which would reject them with a 413.
        client_max_body_size 210m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /chapters {
        # Uploads: chapter media: narrations up to 200 MB, cartoon frames. nginx's default
        # client_max_body_size is 1m, which would reject them with a 413.
        client_max_body_size 210m;

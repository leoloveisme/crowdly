    # /admin and /alpha are ALSO frontend SPA page routes (see src/App.tsx:
    # "/admin", "/admin/invite-users", "/alpha"). Only these specific
    # sub-paths are backend API endpoints — do NOT turn this into a blanket
    # `location /admin` or `location /alpha`, that would break the admin
    # dashboard and alpha-gate pages by routing their page loads to the API
    # instead of the SPA.
    location /admin/invitations {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/applications {

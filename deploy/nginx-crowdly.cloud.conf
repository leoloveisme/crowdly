        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # friends/follows/notifications/messaging routers are mounted at /api in
    # server.js — namespaced there specifically so /friends and
    # /conversations page routes in the SPA don't collide with the API (see
    # the comment in vite.config.ts). /api/events is Server-Sent Events
    # (live notification/message push) and needs its own block ABOVE the
    # general /api block: nginx picks the longest matching prefix, so this
    # takes priority for that one path, and it must not be buffered or it
    # will never flush events to the browser in real time.
    location /api/events {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
    }

    location /api {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # --- end API proxy ---

    # Everything else: serve the built SPA, falling back to index.html for
    # client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
